server:
  port: 8080

spring:
  application:
    name: agent-platform  # 服务标识: AgentPlatform / 个人Agent平台

  datasource:
    url: jdbc:mysql://localhost:3306/agent_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  ai:
    openai:
      api-key: sk-65f0add49f514ee7ae2f38e3e5dc5bde
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7

agent:
  platform:
    jwt:
      secret: ${JWT_SECRET:agent-platform-secret-key-2026-abcdefghij}
      expiration: 86400
      refresh-expiration: 604800
    default-model: openai
    ai:
      fallback-enabled: ${AI_FALLBACK_ENABLED:true}
    upload:
      path: ${UPLOAD_PATH:./uploads}
      allowed-types: image/jpeg,image/png,image/gif,image/webp
      max-size: 5242880
