server:
  port: 8080

spring:
  application:
    name: agent-platform  # 服务标识: AgentPlatform / 个人Agent平台

  datasource:
    url: jdbc:mysql://localhost:3306/agent_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  ai:
    openai:
      api-key: sk-65f0add49f514ee7ae2f38e3e5dc5bde
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
      image:
        options:
          model: dall-e-3

agent:
  platform:
    jwt:
      secret: ${JWT_SECRET:agent-platform-secret-key-2026-abcdefghij}
      expiration: 86400
      refresh-expiration: 604800
    default-model: spring-ai
    ai:
      fallback-enabled: ${AI_FALLBACK_ENABLED:true}
    upload:
      path: ${UPLOAD_PATH:./uploads}
      allowed-types: image/jpeg,image/png,image/gif,image/webp
      max-size: 5242880
    image:
      provider: ${IMAGE_PROVIDER:trae}
      parallel-threshold: 3
      cache-enabled: true
      providers:
        trae:
          enabled: true
          base-url: https://trae-api-cn.mchost.guru/api/ide/v1
          api-key: ${TRAE_API_KEY:}
          default-size: landscape_16_9
        openai:
          enabled: ${OPENAI_IMAGE_ENABLED:false}
          api-key: ${OPENAI_IMAGE_API_KEY:}
          base-url: https://api.openai.com
          model: dall-e-3
          size: 1792x1024
        other:
          enabled: false
          base-url: ${OTHER_IMAGE_API_URL:}
          api-key: ${OTHER_IMAGE_API_KEY:}
