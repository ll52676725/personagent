server:
  port: 8080

spring:
  application:
    name: agent-platform  # 服务标识: AgentPlatform / 个人Agent平台

  datasource:
    url: jdbc:mysql://localhost:3306/agent_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  ai:
    openai:
      api-key: sk-65f0add49f514ee7ae2f38e3e5dc5bde
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
      image:
        options:
          model: dall-e-3

agent:
  platform:
    jwt:
      secret: ${JWT_SECRET:agent-platform-secret-key-2026-abcdefghij}
      expiration: 86400
      refresh-expiration: 604800
    default-model: spring-ai
    ai:
      fallback-enabled: ${AI_FALLBACK_ENABLED:true}
    upload:
      path: ${UPLOAD_PATH:./uploads}
      allowed-types: image/jpeg,image/png,image/gif,image/webp
      max-size: 5242880
    image:
      provider: ${IMAGE_PROVIDER:trae}
      parallel-threshold: 3
      cache-enabled: true
      providers:
        trae:
          enabled: true
          base-url: https://trae-api-cn.mchost.guru/api/ide/v1
          api-key: ${TRAE_API_KEY:}
          default-size: landscape_16_9
        openai:
          enabled: ${OPENAI_IMAGE_ENABLED:false}
          api-key: ${OPENAI_IMAGE_API_KEY:}
          base-url: https://api.openai.com
          model: dall-e-3
          size: 1792x1024
        other:
          enabled: false
          base-url: ${OTHER_IMAGE_API_URL:}
          api-key: ${OTHER_IMAGE_API_KEY:}
    knowledge:
      embedding:
        # 注意：DeepSeek 官方不提供 Embedding API！请从以下 provider 中选择一个：
        # zhipu: 智谱AI (推荐，国内服务快，中文效果好)
        # openai: OpenAI
        # qwen: 通义千问
        # siliconflow: 硅基流动 (兼容 OpenAI 格式，支持多个模型)
        provider: ${EMBEDDING_PROVIDER:zhipu}
        dimensions: 1024
        providers:
          # 方案 1: 智谱AI (推荐)
          # 申请地址: https://open.bigmodel.cn/
          zhipu:
            base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
            api-key: ${ZHIPU_API_KEY:your-zhipu-api-key}
            model: ${ZHIPU_EMBEDDING_MODEL:embedding-3}
            dimensions: 1024
          # 方案 2: OpenAI
          openai:
            base-url: ${OPENAI_EMBEDDING_BASE_URL:https://api.openai.com/v1}
            api-key: ${OPENAI_EMBEDDING_API_KEY:your-openai-api-key}
            model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
            dimensions: 1536
          # 方案 3: 通义千问
          # 申请地址: https://dashscope.console.aliyun.com/
          qwen:
            base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
            api-key: ${QWEN_API_KEY:your-qwen-api-key}
            model: ${QWEN_EMBEDDING_MODEL:text-embedding-v2}
            dimensions: 1536
          # 方案 4: 硅基流动 (支持多个开源模型)
          # 申请地址: https://cloud.siliconflow.cn/
          siliconflow:
            base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
            api-key: ${SILICONFLOW_API_KEY:your-siliconflow-api-key}
            model: ${SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}
            dimensions: 1024
      chunk:
        size: 500
        overlap: 50
    mineru:
      # 是否启用MinerU精细化文档解析，启用后优先使用MinerU解析
      enabled: ${MINERU_ENABLED:true}
      # MinerU API基础地址
      api-base-url: ${MINERU_API_BASE_URL:https://mineru.net/api}
      # MinerU API Token，在mineru.net官网申请。留空则使用Agent轻量API（有IP频率限制）
      api-token: ${MINERU_API_TOKEN:}
      # 模型版本：pipeline(默认)/vlm(推荐，更高精度)/MinerU-HTML(专为网页)
      model-version: ${MINERU_MODEL_VERSION:vlm}
      # 最大轮询次数（每次间隔3秒，默认60次=3分钟）
      max-polling-attempts: ${MINERU_MAX_POLLING:60}
      # 轮询间隔（毫秒）
      polling-interval-ms: ${MINERU_POLLING_INTERVAL:3000}
      # 连接超时（毫秒）
      connect-timeout-ms: ${MINERU_CONNECT_TIMEOUT:30000}
      # 读取超时（毫秒）
      read-timeout-ms: ${MINERU_READ_TIMEOUT:120000}
      # 是否提取图片
      extract-images: ${MINERU_EXTRACT_IMAGES:true}
      # 是否提取表格
      extract-tables: ${MINERU_EXTRACT_TABLES:true}
      # 是否提取公式
      extract-formulas: ${MINERU_EXTRACT_FORMULAS:true}
      # 输出格式：markdown/json/both
      output-format: ${MINERU_OUTPUT_FORMAT:markdown}
    speech:
      whisper:
        base-url: ${WHISPER_BASE_URL:https://api.openai.com/v1}
        api-key: ${WHISPER_API_KEY:}
        model: ${WHISPER_MODEL:whisper-1}
